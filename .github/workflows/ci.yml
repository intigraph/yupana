name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run the suite on demand, without inventing a commit to trigger it.
  #
  # Added while soaking the aegis-beavto flake fix (aegis-x2zuxg): proving a
  # flake is gone needs REPEATED runs of the SAME commit, and with only push and
  # pull_request the only ways to get one were an empty commit or a throwaway
  # PR. Both put noise in the history to answer a question about the history.
  #
  # It matters beyond that soak: an intermittent failure is exactly the case
  # where you need to run the same tree again, and it was the one thing this
  # workflow could not do.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: ""
          - name: mcp
            flags: "--features mcp"
          - name: langs-extra
            flags: "--features langs-extra"
          - name: cpg
            flags: "--features cpg"
          - name: mcp+cpg
            flags: "--features mcp,cpg"
          - name: lsp
            flags: "--features lsp"
          - name: mcp+lsp
            flags: "--features mcp,lsp"
          - name: quipu
            flags: "--features quipu"
          - name: mcp+quipu
            flags: "--features mcp,quipu"
          - name: game-state
            flags: "--features game-state"
          - name: mcp+game-state
            flags: "--features mcp,game-state"
          - name: golden-path
            flags: "--features golden-path"
          - name: mcp+golden-path
            flags: "--features mcp,golden-path"
          # The EXACT set release.yml ships. Every other arm is a pair, so the
          # combination actually installed was never built here (aegis-vwvjwl).
          - name: release
            flags: "--features mcp,langs-extra,quipu,golden-path"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Cache downloaded dependency sources, never compiled target artifacts.
      # A broad cross-feature restore can fill the runner before tests start.
      # New keys and fallbacks exclude archives made by the old target cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-v1-
      - run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings -A missing-docs

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: ""
          - name: mcp
            flags: "--features mcp"
          - name: langs-extra
            flags: "--features langs-extra"
          - name: cpg
            flags: "--features cpg"
          - name: mcp+cpg
            flags: "--features mcp,cpg"
          - name: lsp
            flags: "--features lsp"
          - name: mcp+lsp
            flags: "--features mcp,lsp"
          - name: quipu
            flags: "--features quipu"
          - name: mcp+quipu
            flags: "--features mcp,quipu"
          - name: game-state
            flags: "--features game-state"
          - name: mcp+game-state
            flags: "--features mcp,game-state"
          - name: golden-path
            flags: "--features golden-path"
          - name: mcp+golden-path
            flags: "--features mcp,golden-path"
          # The EXACT set release.yml ships. Every other arm is a pair, so the
          # combination actually installed was never built here (aegis-vwvjwl).
          - name: release
            flags: "--features mcp,langs-extra,quipu,golden-path"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-v1-

      # Scratch state must never travel between runs. Source-only caches no
      # longer contain target/, but retain cleanup as defense for future cache
      # policy changes and independently nonce the test sessions.
      - name: Discard test state restored from the cache
        run: rm -rf target/test-state

      - name: Install real language servers for the LSP contract
        if: matrix.name == 'lsp'
        run: |
          rustup component add rust-analyzer rust-src
          npm install --global typescript-language-server@5.3.0 typescript@5.9.3

      - run: cargo test ${{ matrix.flags }}
        env:
          YUPANA_REQUIRE_LSP_SERVERS: ${{ matrix.name == 'lsp' && '1' || '0' }}

      - name: Report real language-server warm latency
        if: matrix.name == 'lsp'
        run: cargo test --features lsp real_ -- --nocapture
        env:
          YUPANA_REQUIRE_LSP_SERVERS: "1"

  # Feature arms join the matrix as their engines land, so a feature can never
  # "ship dark" (Bobbin's hard-won lesson). --features quipu joined in Phase 4
  # (promotion): its tests are in-process (rudof SHACL) and the refusal path
  # returns before any network call, so the arm needs no live Quipu.
  #
  # --features game-state joined with the FR-35..FR-39 harness, in the same
  # change that added the feature. Both arms are needed, not just the combined
  # one: `game-state` alone covers the engine and its tenancy, and
  # `mcp,game-state` is the only arm that compiles the /ingest, /guard and
  # /whatif surfaces plus the three MCP tools. The engine is pure in-memory —
  # no network, no fixtures — so both are self-contained.
  #
  # This matrix is NOT the whole test suite. `tests/spool_to_dogwood.py` (the
  # replay converter) is Rust-free and has no feature dependence, so it runs
  # once in the `check` job below via the `replay-converter-tests` pre-commit
  # hook rather than nine identical times here. If that hook is ever added to
  # this workflow's SKIP list, the suite must move into this matrix instead —
  # it gated nothing at all until 2026-08.

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-v1-
      - run: cargo build

  check:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # Both skips are justified ONLY because a dedicated job covers each on the
      # SAME triggers (yupana #84 asked whether this list had outlived its reason):
      #   cargo-clippy  -> the Clippy matrix above, 5 arms, --all-targets -D warnings
      #   mdbook-build  -> the `book` job below
      # `book` exists because that second claim used to be false. The only mdbook
      # build was docs.yml, which runs on push-to-main behind a `docs/book/**`
      # path filter and never on pull_request — so a PR could not break the book
      # in CI, and a broken book was only discovered after merge.
      - run: pre-commit run --all-files
        env:
          SKIP: mdbook-build,cargo-clippy

      # The refusals that stand between a rehearsal and crates.io (aegis-pz5crt).
      # This job is a required check, which is the right place for it: a guard
      # protecting the release lane should be proven by something that blocks a
      # release when it breaks.
      #
      # It is a selftest rather than a lint because the property is behavioural.
      # Nothing else can catch a guard that has been quietly loosened — the
      # workflow would stay green, and the next thing to notice would be a
      # rehearsal tag on crates.io, which cannot be undone.
      - name: Prove the crates publish guard still refuses
        run: scripts/ci/crates-publish-guard.sh --selftest

  book:
    name: Book builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          # The key names the EXACT version, so a binary cached from another
          # version (or the old "^0.4" range) is never picked up.
          key: ${{ runner.os }}-mdbook-0.4.52
      - name: Install mdbook
        run: command -v mdbook || cargo install mdbook --version "=0.4.52" --locked
      - run: mdbook build docs/book

  lint-markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx markdownlint-cli2@0.23.2

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RDF test parser
        run: python3 -m pip install rdflib==7.6.0
      - name: Test copied pointer and publication boundaries
        run: |
          python3 scripts/test-repository-share-query.py
          python3 scripts/test-repository-knowledge.py
          python3 scripts/test-repository-share-publication.py
